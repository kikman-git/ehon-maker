# Generated into Ehon.xcodeproj by `xcodegen`. The .xcodeproj is NOT committed:
# this file is the source of truth, which keeps the project diffable and avoids
# .pbxproj merge conflicts. Run `xcodegen` after changing it.
name: Ehon

options:
  bundleIdPrefix: app.ehon
  # LastUpgradeCheck; without it Xcode nags "Update to recommended settings" on every open.
  xcodeVersion: "26.3"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    # Automatic signing so a real device works. Set your team once:
    #   export EHON_DEVELOPMENT_TEAM=ABCDE12345   (Xcode > Settings > Accounts)
    # then re-run `make xcodeproj`. Simulator builds need no team at all.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${EHON_DEVELOPMENT_TEAM}

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    majorVersion: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    majorVersion: 9.0.0

targets:
  Ehon:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Cloud.xcconfig
      Release: Config/Cloud.xcconfig
    sources:
      - path: Ehon
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ehon.petapeta
        CODE_SIGN_ENTITLEMENTS: Ehon/Ehon.entitlements
        INFOPLIST_FILE: Ehon/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - EhonCore
    preBuildScripts:
      # `script:` invokes the file; `path:` would inline its contents, which loses the
      # shebang and makes BASH_SOURCE point into DerivedData instead of the repo.
      - script: exec "$SRCROOT/scripts/build-shared-framework.sh"
        name: Build shared KMP framework
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Debug only: the assembled stories land in the bundle after Copy Bundle Resources, before signing.
      - script: exec "$SRCROOT/scripts/bundle-templates.sh"
        name: Bundle story templates (Debug)
        basedOnDependencyAnalysis: false

  EhonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EhonTests
    dependencies:
      - target: Ehon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ehon.petapeta.tests
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - EhonCore

schemes:
  Ehon:
    build:
      targets:
        Ehon: all
        EhonTests: [test]
    test:
      targets:
        - EhonTests
      gatherCoverageData: false
  EhonSync:
    build:
      targets:
        Ehon: all
        EhonTests: [test]
    test:
      targets:
        - EhonTests
      environmentVariables:
        EHON_SYNC_TESTS: "1"
