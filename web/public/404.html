<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fbf7ee" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ページが見つかりません · ぺたぺた STUDIO</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf7ee; color: #353d32; font: 15px/1.9 -apple-system, BlinkMacSystemFont, sans-serif; }
      main { max-width: 32em; padding: 40px 24px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 28px; font-weight: 400; }
      p { color: #6e7165; }
      a { display: inline-block; margin-top: 20px; padding: 12px 22px; background: #a54f36; color: #fffaf0; border-radius: 5px; text-decoration: none; }
      a:focus-visible { outline: 3px solid #a54f36; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <p>ぺたぺた STUDIO · 404</p>
      <h1>このページは、まだ白紙のようです。</h1>
      <p>ページが移動したか、リンクがちがっているかもしれません。はじまりのページから、もういちど。</p>
      <a href="/">はじまりのページへ</a>
    </main>
  </body>
</html>
